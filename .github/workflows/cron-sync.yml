name: Semi-Weekly Rankings Sync

on:
  schedule:
    # Run every Monday and Thursday at 12:00 UTC to prevent Supabase 7-day auto-pause
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VTAWEB Sync API
        run: |
          echo "Triggering API sync route..."
          response=$(curl -s -w "\n%{http_code}" -X POST ${{ secrets.VTAWEB_API_URL }}/api/cron/sync \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          # Extract HTTP status code and body
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "Response Body: $body"
          echo "HTTP Status: $http_code"
          
          if [ "$http_code" -ne 200 ]; then
            echo "⚠️ Sync returned non-200 status: $http_code — logged but not fatal."
            echo "   Body: $body"
            # Do NOT exit 1 here — repeated failures cause GitHub to auto-disable
            # the workflow entirely, killing the keep-alive mechanism.
          else
            echo "✅ Sync completed successfully"
          fi

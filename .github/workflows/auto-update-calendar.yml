name: Auto Update Tournament Calendar

on:
  schedule:
    # Run at 00:00 on December 1st every year
    - cron: '0 0 1 12 *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub Actions UI

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run calendar scraper
        run: python scripts/update_tournaments.py
        
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/lib/data/tournaments.json || echo "changed=true" >> $GITHUB_OUTPUT
          
      - name: Commit and Push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/lib/data/tournaments.json
          git commit -m "chore: auto-update tournament calendar for next year"
          git push

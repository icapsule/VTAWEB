name: Supabase Keep-Alive Ping

on:
  schedule:
    # Run every 2 days at 06:00 UTC (staggered to prevent Supabase 7-day auto-pause)
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgREST API Directly
        run: |
          echo "🏓 [1/2] Direct Supabase PostgREST API Gateway Ping..."
          SUPABASE_URL="https://llduuesndaxvxvluxull.supabase.co"
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$ANON_KEY" ]; then
            ANON_KEY="sb_publishable_hRZOG5tKpPc0EgQ--Et30Q_92dz7wUw"
          fi
          
          HTTP_CODE=$(curl -s -o /tmp/supabase_response.txt -w "%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/rankings?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          
          BODY=$(cat /tmp/supabase_response.txt)
          echo "Supabase Direct HTTP Status : $HTTP_CODE"
          echo "Supabase Direct Response    : $BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "⚠️ Warning: Direct PostgREST ping returned $HTTP_CODE"
          else
            echo "✅ Direct Supabase PostgREST API ping successful."
          fi

      - name: Ping VTAWEB Vercel Route
        run: |
          echo "🏓 [2/2] Triggering VTAWEB Vercel Keep-Alive Route..."
          TARGET_URL="${{ secrets.VTAWEB_API_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://vtaweb.vercel.app"
          fi
          
          HTTP_CODE=$(curl -s -o /tmp/vercel_response.txt -w "%{http_code}" "$TARGET_URL/api/cron/keep-alive")
          BODY=$(cat /tmp/vercel_response.txt)
          echo "Vercel Route HTTP Status : $HTTP_CODE"
          echo "Vercel Route Response    : $BODY"
          echo "✅ Dual Keep-alive workflow finished."

